# Render Blueprint: the live demo (R-16). AWS stays the reference production target
# (docs/deploy.md, infra/terraform); this is the cheap, always-on demo of the same containers.
#
# Paid (no cold starts): Postgres, the lending core API, its worker and the card network.
# Free: the two static front-ends (CDN, never sleep).
# Every secret is generated by Render (never typed, never in git). Service URLs follow the
# service names; if Render had to suffix a name, update the *_URL / CORS_ORIGINS values.

envVarGroups:
  # Shared by the core and the card network (P3: both sides of each HMAC).
  - name: acme-credit-signing
    envVars:
      - key: NETWORK_SIGNING_SECRET
        generateValue: true
      - key: PROVIDER_SIGNING_SECRET
        generateValue: true
      - key: PROVIDER_API_SECRET
        generateValue: true
  # Demo users the seed creates; each front-end gets only its own pair (public by design:
  # it is a demo with fake money, and the "Usar cuenta demo" buttons fill them).
  - name: acme-credit-demo-customer
    envVars:
      - key: SEED_CUSTOMER_EMAIL
        value: demo@acme.test
      - key: SEED_CUSTOMER_PASSWORD
        generateValue: true
  - name: acme-credit-demo-admin
    envVars:
      - key: SEED_ADMIN_EMAIL
        value: admin@acme.test
      - key: SEED_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: acme-credit-db
    plan: basic-256mb
    region: virginia
    databaseName: acme_credit
    user: acme
    postgresMajorVersion: '17'
    ipAllowList: [] # private network only

services:
  - name: acme-credit-api
    type: web
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./infra/docker/node-service.Dockerfile
    dockerContext: .
    # Migrate, seed, then serve (one command, each step must succeed).
    dockerCommand: node scripts/start-prod.mjs
    healthCheckPath: /health
    envVars:
      - key: PACKAGE
        value: '@acme/api'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: acme-credit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://acme-credit-wallet.onrender.com,https://acme-credit-admin.onrender.com
      - key: PROVIDER_API_URL
        value: https://acme-credit-network.onrender.com
      # The apps live on other *.onrender.com sites (a public suffix): the refresh cookie must
      # be SameSite=None; Secure to travel. CORS still limits who may read the answers.
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: '1'
      - key: SEED_DEMO_CUSTOMER
        value: 'true'
      - fromGroup: acme-credit-signing
      - fromGroup: acme-credit-demo-customer
      - fromGroup: acme-credit-demo-admin

  - name: acme-credit-worker
    type: worker
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./infra/docker/node-service.Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    envVars:
      - key: PACKAGE
        value: '@acme/api'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: acme-credit-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: acme-credit-api
          envVarKey: JWT_SECRET
      - key: PROVIDER_API_URL
        value: https://acme-credit-network.onrender.com
      - fromGroup: acme-credit-signing

  - name: acme-credit-network
    type: web
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./infra/docker/node-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PACKAGE
        value: '@acme/card-network'
      - key: NODE_ENV
        value: production
      - key: CORE_API_URL
        value: https://acme-credit-api.onrender.com
      - key: PUBLIC_URL
        value: https://acme-credit-network.onrender.com
      - key: WEB_URL
        value: https://acme-credit-wallet.onrender.com
      - key: CORS_ORIGINS
        value: https://acme-credit-wallet.onrender.com
      - key: TRUST_PROXY
        value: '1'
      - fromGroup: acme-credit-signing

  - name: acme-credit-wallet
    type: web
    runtime: static
    buildCommand: >-
      npx -y pnpm@12.14.0 install --frozen-lockfile --filter "@acme/web..." --filter acme-credit &&
      PUBLIC_DEMO_EMAIL="$SEED_CUSTOMER_EMAIL" PUBLIC_DEMO_PASSWORD="$SEED_CUSTOMER_PASSWORD"
      npx -y pnpm@12.14.0 turbo run build --filter=@acme/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: SITE_URL
        value: https://acme-credit-wallet.onrender.com
      - key: PUBLIC_API_URL
        value: https://acme-credit-api.onrender.com
      - key: PUBLIC_NETWORK_URL
        value: https://acme-credit-network.onrender.com
      - key: PUBLIC_DEMO_MODE
        value: 'true'
      - fromGroup: acme-credit-demo-customer
    headers:
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - name: acme-credit-admin
    type: web
    runtime: static
    buildCommand: >-
      npx -y pnpm@12.14.0 install --frozen-lockfile --filter "@acme/admin..." --filter acme-credit &&
      PUBLIC_DEMO_ADMIN_EMAIL="$SEED_ADMIN_EMAIL" PUBLIC_DEMO_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD"
      npx -y pnpm@12.14.0 turbo run build --filter=@acme/admin
    staticPublishPath: ./apps/admin/dist
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: SITE_URL
        value: https://acme-credit-admin.onrender.com
      - key: PUBLIC_API_URL
        value: https://acme-credit-api.onrender.com
      - key: PUBLIC_DEMO_MODE
        value: 'true'
      - fromGroup: acme-credit-demo-admin
    headers:
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
