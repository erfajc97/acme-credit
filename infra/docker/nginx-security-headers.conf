# Included in EVERY location: nginx drops server-level add_header as soon as a location
# defines its own. Script and style hashes come from the page's Astro meta CSP; this header
# adds what a meta tag cannot carry (frame-ancestors).
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
